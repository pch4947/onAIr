  - {id: djq1, type: dj_question, body: "DJ님은 주말에 뭐 하세요?"}
  - {id: off1, type: off_topic, body: "지금 막 퇴근했어요"}
  # story+chat
  - {id: sh1, type: short, body: "주말 너무 짧아요"}
  # talk+chat2
  - {id: tq1, type: topic_question, body: "혼자 가기 좋은 전시 추천해 주세요"}
  - {id: on3, type: on_topic, body: "이번 주말엔 대청소 하려고요"}
