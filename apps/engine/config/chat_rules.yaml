# 채팅 유형 분류와 반영 정책 — docs/CORNER_DESIGN.md 5.1.3, 5.7절.
# 표현 목록은 실제 채팅 로그로 다듬는다 (U17). 수치는 지연 실측 후 조정한다 (U18).
#
# [초기값]  버퍼·생성 지연 산술로 정한 값
# [임시값]  근거 없이 자리만 채운 값 — 실측 전까지 믿지 않는다

reaction_window_sec: 60       # [초기값] 반응형 후보 창 W
standalone_window_sec: 600    # [임시값] 독립형 후보 창 W_s
flood_threshold: 8            # [임시값] 최근 W 동안 입력이 이만큼이면 폭주
max_quote_chars: 60           # [임시값] 말로 인용하기 어려운 길이
short_reaction_chars: 20      # [임시값] 감탄·평가 표현으로 볼 최대 길이
message_max_chars: 200        # [예시] 문자 낭독 길이 상한 (계약 10.3절)

# 화제 전환(STEER) 판별 — CORNER_DESIGN 5.2절, U2. 표현 목록은 실제 채팅 로그로 다듬는다
steer_min_chars: 6            # [임시값] "왜요?"처럼 화제가 될 내용이 없는 채팅을 거른다
steer_questions: ["?", "？"]
steer_requests:
  - 해 주세요
  - 해주세요
  - 해 줘
  - 해줘
  - 들려주세요
  - 들려줘
  - 알려주세요
  - 알려줘
steer_address:                # 방의 DJ 이름은 코드에서 더한다
  - DJ
  - 디제이

# 집계 언급 — CORNER_DESIGN 5.7, 9.2절. 건수 기준은 flood_threshold를 쓴다
aggregate_share: 0.4          # [임시값] 채팅한 사람 중 같은 키워드를 말한 사람의 비율
aggregate_min_people: 3       # [임시값] 같은 키워드를 말한 최소 인원 — 한 사람의 도배를 거른다
aggregate_stopwords:          # 어디에나 나와 화제라고 할 수 없는 말. 감탄 표현은 reactions도 뺀다
  - 노래
  - 음악
  - 방송
  - 사람
  - 우리
  - 이거
  - 그거
  - 저도
  - 얘기
  - 때문에
  - 다른
aggregate_predicate_endings: [요, 다, 죠, 네, 까, 니, 나, 지, 어, 아]  # 이렇게 끝나는 토큰은 화제가 아니라 서술어로 본다

# 문자 코너 예고 — CORNER_DESIGN 9.2절
preview_min_messages: 5       # [예시] inbox에 이만큼 쌓이면 M
preview_lookahead: 2          # [예시] 문자 코너가 다음 이만큼의 코너 안에 있으면 예고하지 않는다
preview_min_remaining_sec: 300  # [임시값] 남은 방송이 이보다 짧으면 읽어 준다고 약속하지 않는다

# 규칙 1 — 대상을 가리키는 표현
pointing:
  - 이 노래
  - 이노래
  - 이 곡
  - 이곡
  - 방금
  - 지금 나오는
  - 이 사연
  - 그 사연
  - 아까 그

# 규칙 3 — 짧은 감탄·평가 표현
reactions:
  - 좋다
  - 좋아요
  - 좋네
  - 대박
  - 공감
  - 최고
  - 명곡
  - 띵곡
  - 슬퍼
  - 슬프
  - 울컥
  - 신나
  - ㅋㅋ
  - ㅎㅎ
  - ㅠㅠ
  - ㅜㅜ
