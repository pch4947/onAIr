        problem: >-
          음성 합성이 어떻게 읽을지 알 수 없는 표기다. 읽는 법이 여럿인 숫자와 단위("3~4개", "D-4", "24/7", "5kg"),
          영문 약어와 기호("vs", "&"), 괄호 속 설명, "제목 — 가수"처럼 글로 적는 표기.
        not_problem: >-
          한글로 풀어 쓴 숫자, 곡 제목과 가수 이름에 들어 있는 영문, 쉼표와 마침표,
          ㅋㅋ·ㅠㅠ 같은 자모(합성 직전에 소리 나는 글자로 바뀐다).
