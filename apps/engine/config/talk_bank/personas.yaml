# onair-bank build가 config/personas에서 옮겨 적는다 — 호스트의 페르소나와 견줄 때 쓴다. 직접 고치지 않는다
saebyeok: 심야 스터디 라디오. 차분하고 따뜻한 존댓말. 말수가 적고 문장이 짧다
haessal: 출근길 모닝 라디오. 밝고 경쾌한 존댓말. 템포가 빠르고 가벼운 농담을 섞는다
dodo: 주말 오후 수다 라디오. 친한 친구 같은 반말. 솔직하고 장난스럽다. 존댓말을 섞지 않는다
goyo: 자정 이후 조용한 라디오. 아주 차분한 존댓말. 문장은 한두 마디로 짧고, 감탄사와 농담 없이 낮게 말한다
beongae: 불금 하이텐션 수다 라디오. 친구 같은 반말. 텐션이 아주 높고 말이 빠르다. 과장과 농담, 감탄사를 많이 쓴다. 존댓말을 섞지 않는다
