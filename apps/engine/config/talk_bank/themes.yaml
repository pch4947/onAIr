# 이야깃거리 데이터셋의 씨앗 (#332, CORNER_DESIGN 5.9절).
# onair-bank build가 주제 × 페르소나 × 형식으로 LLM에 물어 items/{형식}.{페르소나}.jsonl을 만든다.
# 외부 글을 긁지 않는다 — 여기 적은 주제가 전부다. 주제를 더하거나 고친 뒤 다시 만든다:
#   onair-bank build --llm gemini --llm-model gemini-3.8-flash --embedder gemini           # 전부 새로
#   onair-bank build --llm gemini --llm-model gemini-3.8-flash --embedder gemini --fill    # 빈 자리만 (주제를 더한 뒤, 끊긴 뒤)
#   onair-bank build --llm gemini --embedder gemini --only talk.common                     # 한 칸만
# 호스트가 정하는 오늘의 주제는 자유 입력이다. 여기 없는 주제는 뜻이 가까운 이야깃거리를 찾아 쓰고,
# 가까운 것이 없으면 LLM이 새로 짠다 (inputs/topic_plan.py).

# 이야깃거리를 따로 만드는 페르소나 — config/personas/{id}.yaml. 공통(common)은 늘 만든다
personas: [saebyeok, haessal, dodo, goyo, beongae]

# 이야기를 푸는 방식. 방식 없이 물으면 거의 전부가 "~하는 순간" 꼴의 장면 묘사로 돌아온다 (2026-11-19 실측).
# 칸마다 방식을 나눠 맡긴다 — 방송 하나가 보는 공통 + 프리셋 하나에 여섯 방식이 다 들어간다 (bank.kinds_for).
# 풀이는 생성 프롬프트에 그대로 들어간다. 방식을 더하거나 고치면 데이터셋을 다시 만든다
kinds:
  장면: 그 주제에서 누구나 한 번쯤 겪는 구체적인 한 장면을 처음부터 끝까지 따라간다.
  갈림: 사람마다 갈리는 선택이나 버릇을 다룬다. 양쪽이 저마다 왜 그러는지를 고루 그리고 한쪽 편을 들지 않는다.
  요령: 사람들이 저마다 쓰는 작은 요령과 나름의 규칙을 모은다. 효과가 있다고 장담하지 않는다.
  달라짐: 예전과 지금, 어릴 때와 어른이 된 뒤처럼 시간이 지나며 달라진 것을 견준다.
  어긋남: 뜻대로 되지 않은 일, 민망하거나 웃긴 실패를 다룬다. 누구도 깎아내리지 않는다.
  사람: 그 주제에서 얽히는 다른 사람(가족, 친구, 동료, 낯선 사람)과의 사이에서 생기는 일을 다룬다.

# per_theme: 주제 하나에 한 칸이 만드는 갈래 수. guide는 생성 프롬프트에 그대로 들어간다.
# news 형식은 따로 만들지 않는다 — 소재가 뉴스 피드이고, 주제 토크로 넘어가면 talk의 것을 쓴다
formats:
  talk:
    per_theme: 4
    guide: 토크 방송이다. 주제 자체를 여러 면에서 이야기한다.
  music:
    per_theme: 4
    guide: 음악 방송이다. 주제를 음악을 듣는 일이나 노래에 얽힌 기억과 엮는다. 특정 곡 제목과 가수 이름은 넣지 않는다.

