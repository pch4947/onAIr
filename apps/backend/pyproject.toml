[project]
name = "onair-backend"
version = "0.1.0"
description = "FastAPI backend for the onAIr shared live radio service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
