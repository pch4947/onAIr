# L0(입력단)/L2(출력단) 공용 룰 — 코드와 분리해 관리 (설계 문서 4.6)
# 초기 예시 룰이며 팀 검토를 거쳐 확장한다. (YAML 단일따옴표 = 정규식 리터럴)
banned_patterns:
  - '01[016789][ -]?\d{3,4}[ -]?\d{4}'        # 전화번호
  - 'https?://\S+'                             # URL
  - '[\w.+-]+@[\w-]+\.[\w.]+'                  # 이메일
  # 풀어 쓴 연락처 (#218). L2(DJ 멘트)에도 쓰므로 일상 표현에 걸리지 않게 좁게 잡는다
  - '(?i)[a-z0-9-]\.(com|net|org|kr|io|me|co)(?![a-z0-9])'    # 스킴 없는 도메인 — 뒤에 조사가 붙어도 잡는다
  - '닷\s?(컴|넷|케이알|오알지)|점\s?(컴(?![백퓨팩플포패])|케이알|오알지)'  # 말로 쓴 도메인 — "장점 넷", "닷새", "시점 컴백"은 통과
  - '공\s?일\s?[공일육칠팔구][\s-]?([공영일이삼사오육칠팔구][\s-]?){7,8}'  # 말로 쓴 휴대폰 번호
  - '(씨발|병신|새끼|좆)'                        # 욕설(예시)

# ── 뉴스 대본의 주관 표현 (CORNER_DESIGN 6.4절 U3, #286) ───────────────────────
# 뉴스 내용을 전하는 단계(news_*)의 출력에만 건다. 문장마다 보고, 걸린 문장은 한 번 다시 쓰게 한 뒤에도 남으면 뺀다.
# 2026-11-14에 실제 피드 5개 분야·페르소나 5개로 뽑은 대본에서 정했다 (docs/ENGINE_TUNING_LOG.md T-011):
#   일부러 소감을 붙인 대본 191개의 소감 문장 96% 검출, 사실만 전한 문장 약 1,600개에서 오탐 0.
# 따옴표 안(작품·프로그램 이름, 인용문)은 보지 않는다. first_person·address·reaction_ending을 뺀 묶음은
# 남의 말을 옮긴 문장("안타깝다고 말했습니다")이면 걸지 않는다 (news_reported).
news_subjective:
  evaluation:   # 평가·감정 — DJ가 소식을 어떻게 느끼는지
    - '다행|안타깝|안타까[운웠워]|아쉽|아쉬[운웠워]|놀랍|놀라[운웠워]|놀랐|충격적|반가[운웠워]|반갑|기쁜|기쁘|기뻤|슬픈|슬프|슬펐|씁쓸|훈훈|뭉클|통쾌|짜릿'
    - '대단하|대단한|굉장|멋진|멋지|훌륭|끔찍|황당|어이없|흥미롭|흥미로운|재미있|재밌|인상적|인상을 남기|인상 깊'
    - '기대되|기대됩|기대돼|기대가 (크|커|됩|돼)|기대해|걱정되|걱정됩|걱정돼|걱정스|우려스|우려됩|우려돼'
    - '느껴지|느껴져|느껴집|느낍니다|느껴요|마음이 (무겁|아프|따뜻|쓰이)|와닿|다가오는 것|다가옵니다'
    - '눈에 (남|띄|밟)|눈을 뗄 수|눈길이 가|눈길을 (끄|끕|끌)'
    - '(생각하|돌아보|들여다보|살펴보|확인하|떠올리|되새기|주목하|보)게 (돼|됩|되|합니다|해요|해[.!?]|하는|만드)'
  watch:        # 지켜보기·궁금 — 전망을 대신하는 맺음말
    - '지켜보(겠|게|면|아야|려|시죠|세요|자|는 재미)|지켜보고 싶|지켜봐야|지켜봅시다|두고 볼|두고 봐|눈여겨'
    - '(지켜볼|살펴볼|들여다볼|주목할|생각해 볼|기억할|눈여겨볼) (소식|대목|부분|일|만|필요|때)'
    - '궁금해|궁금하|궁금합'
  wish:         # 바람·권유
    - '바랍니다|바라요|바랄게|길 바라|기를 바라|바라[.!?]|면 좋겠|으면 좋겠|좋겠습니다|좋겠어|좋겠네|좋겠다|응원'
    - '고 싶(습니다|어요|어|다|네|어지|어져)'
  judgment:     # 판단 — 무엇이 중요하다·필요하다
    - '중요하겠|중요해 보|중요한 것 같|필요해 보|필요가 있겠|필요하겠|필요할 것 같|야겠|해야 할 것|야 할 때|할 만하|볼 만하|만하겠|만합니다|만해요|만해[.!?]'
  guess:        # 근거 없는 추측
    - '것 같(습니다|아요|아|네요|네|다|죠)|듯(합니다|해요|해|하네|하다)[.!?]|지 않을까|아닐까|일지도|지도 모르'
    - '[해여아어워] 보입니다|[해여아어워] 보여요|[해여아어워] 보여[.!?]|[해여아어워] 보이네'
    - '(있|없|좋|크|많|이|되)겠(다|는데|어|네|죠|지)'
  first_person: # 1인칭 의견
    - '제 생각|제가 보기|개인적으로|내 생각|내가 보기'
    - '(저는|저도|나는|나도) [^.?!]*(생각|같|느끼|느껴|좋아|좋네|싶|궁금|놀랐|기대|바라|봅니다|봐요)'
  address:      # 청취자에게 의견을 묻거나 감상을 권한다
    - '어떻게 생각하|어떠세요|어떠신가요|어때요|어때[.?!]|여러분은|여러분도'
  reaction_ending:   # 반응하는 말끝 — 문장 끝에서만 본다
    - '(네요|군요|구나|더라고요|더라|잖아요|잖아|거든요|거든|겠네요|겠네|겠죠|겠지|네|는데|ㄴ데)\W*$'
# 전망 — 같은 문장에 출처가 있으면 전하는 말이고, 없으면 DJ의 전망이다
news_forecast:
  - '것으로 (보입니다|보여요|보여|보인다|보이네)|전망(입니다|이에요|이야|이다|돼|됩니다)|예상(됩니다|돼요|돼|된다)(?!고)|모양(입니다|이에요|이야|이다)'
news_attribution:
  - '에 따르면|에 의하면|보도|전했|전한|밝혔|밝힌|말했|설명했|내다봤|분석했|발표했|예상했|전망했|라고 |다고 |다는 '
# 남의 말을 옮긴 것 — 주관 표현 뒤에 이 말이 오면 DJ의 말이 아니다 ("안타깝다고 말했습니다")
news_reported:
  - '다고|라고|다며|라며|다는|라는|냐고|자고'
