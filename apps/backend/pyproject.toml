[project]
name = "onair-backend"
version = "0.1.0"
description = "FastAPI backend for the onAIr shared live radio service"
requires-python = ">=3.12"
dependencies = [
    "onair-schema>=0.1.0",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # uvicorn이 웹소켓을 받으려면 필요하다 (#312)
    "websockets>=13,<16",
    "python-dotenv>=1,<2",
    "redis>=5,<8",
    "bcrypt>=4,<5",
    "pyjwt>=2,<3",
    "email-validator>=2,<3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
