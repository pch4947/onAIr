# 로컬 개발용 스테이션 설정 — 실제 운영에서는 station.created 이벤트가 이 역할을 대체한다 (M3)
station:
  id: st_local_dev
  # persona 파일 경로 또는 필드 직접 기입 (dj_name, tone, concept + 선택: examples, forbidden,
  # signature_phrases). 프리셋: config/personas/ — 실행 시 --persona로 바꿔 끼울 수 있다
  profile: config/personas/saebyeok.yaml
  broadcast_minutes: 60
  # 방송 형식과 호스트 선택 — 운영에서는 station.created가 싣는다 (계약 v2 10.2절, #102)
  format: talk                # music | talk | news — config/formats/{format}.yaml. 실행 시 --format으로 바꿀 수 있다
  # corners: [story_corner, topic_talk]   # talk 본 코너 2~3개. 비우면 형식 기본값
  # news_sections: [general, it]          # news 분야 2~3개 (general·economy·it·sports·culture)
  intensity: mid              # 참여 강도 low | mid | high
  topic: 시험 기간을 버티는 나만의 방법   # 오늘의 주제. 비우면 컨셉을 쓴다
  # first_song: {track_ref: "yt:abc123", title: 밤편지, artist: 아이유, duration_ms: 253000}

pipeline:
  llm: dummy                  # dummy(고정 대본) | claude(ANTHROPIC_API_KEY 필요)
                              # | gemini(GEMINI_API_KEY 필요) — 제공자 비교 실측 중(확인 3)
                              # | openai(Chat Completions 호환, OPENAI_API_KEY)
  # llm_model: gpt-6-luna       # 팀 결정 LLM (llm: openai, 2026-10-08). claude 기본값: claude-haiku-4-5,
                                # gemini 기본값: gemini-2.5-flash. openai는 필수
  # llm_base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1  # openai 호환 서버
  # llm_reasoning_effort: low    # openai 추론 모델의 추론량 — 낮을수록 빠르다
  emit_corner_changed: true   # corner.changed 발행 — 청취 화면의 "지금 · 코너" 안내에 쓰인다 (계약 10.7절).
                              # VM의 엔진 서비스가 이 파일을 읽는다. PR #189 이전 백엔드와는 켜지 않는다 (이벤트가 격리됨)
  emit_votes: true            # DJ 대 청취자 코너의 투표(vote.open)를 연다 (#279, 계약 10.8절).
                              # 백엔드(PR #285)와 프론트의 투표 카드(PR #288)가 배포돼 2026-11-15에 켰다.
                              # 끄면 그 코너는 주제 토크로 대체된다. 투표를 받지 않는 백엔드와는 켜지 않는다 (이벤트가 격리됨)
  emit_song_picks: true       # DJ 선곡(track.suggest)을 보낸다 (#295, 계약 3.4절) — 들고 있는 다음 곡이 없으면 DJ가 장르와 주제에
                              # 맞는 곡 후보를 내고 백엔드가 찾아 튼다. 백엔드(PR #298)가 track.suggest를 받게 병합돼 2026-11-15에 켰다.
                              # 플레이리스트가 있는 방송에서는 제안하지 않는다. 문제가 생기면 false로 되돌린다 —
                              # 그러면 플레이리스트가 빈 방송은 다시 곡 없이 말만 한다
  # vote_window_sec: 60       # 투표 창 길이(초) — 고민을 소개하는 멘트의 재생 시작부터
  talk_bank: config/talk_bank # 이야깃거리 데이터셋 (#332, CORNER_DESIGN 5.9절) — 방송 시작 때 주제와 가까운 이야깃거리를
                              # 임베딩으로 찾아 갈래 계획의 참고 자료로 넣는다. 지우면 LLM만으로 갈래를 짠다.
                              # 엔진만 바뀌므로 백엔드 배포를 기다리지 않는다
  embedder: gemini            # dummy(글자 겹침 — 흐름 확인용, 사실상 찾지 못한다) | gemini(GEMINI_API_KEY 필요).
                              # 키가 없으면 경고만 남기고 데이터셋 없이 방송한다. 실행 시 --embedder로 바꿀 수 있다
  # talk_bank_cache: var/talk_bank.sqlite  # 벡터 캐시. 지워도 된다 — 없는 것만 다시 임베딩한다 (2,664건에 1분쯤).
                              # 운영(--serve)은 엔진을 띄울 때 미리 채운다. 손으로 채우기: onair-bank index --embedder gemini
  topic_usage: var/topic_usage.sqlite  # 방송별로 쓴 갈래의 기록 — 기간 안에 다른 방송이 쓴 갈래를 규칙으로 뺀다.
                              # 지우면 적지도 거르지도 않는다. 기록을 비우려면 파일을 지운다 (리허설을 여러 번 한 뒤 등)
  topic_reuse_days: 30        # [임시값] 이 기간이 지난 갈래는 다시 써도 된다
  emit_corner_format: true    # corner.changed에 형식(format)을 싣는다 — 방송 중 형식 전환 때 화면이 소리에 맞춰 바뀐다 (#260).
                              # 백엔드가 이 필드를 받게 배포돼(PR #284) 2026-11-15에 켰다. 받지 않는 백엔드와 켜면
                              # corner.changed가 통째로 격리된다
  tts: dummy                  # dummy(무음 wav) | gemini(운영 TTS, GEMINI_API_KEY 필요)
                              # | cartesia(비교 측정용, CARTESIA_API_KEY) | google(Cloud TTS, GOOGLE_TTS_API_KEY)
                              # | edge(청취 테스트용, pip install -e ".[tts]")
  # tts_voice: kore           # gemini 기본값: kore — 목록: onair-engine --list-voices
                              # cartesia는 필수, google 기본값: ko-KR-Chirp3-HD-Aoede, edge 기본값: ko-KR-SunHiNeural
  tts_cache_dir: var/tts_cache  # 같은 문장 재합성 방지 캐시 — 엔진 전용, audio_dir 밖에 둔다
  pause_ms: 700               # [임시값] 멘트 끝에 붙이는 쉬는 시간(무음, ms). 멘트가 숨 쉴 틈 없이 이어 붙는다는
                              # 2026-11-15 실제 방송 피드백으로 넣었다. 0이면 붙이지 않는다. WAV를 내는 TTS(gemini)에만 붙는다
  max_concurrent_generations: 2
  dummy_tracks: true           # 백엔드 곡(track.queued)이 없을 때 더미 곡 이름으로 곡 소개 — 로컬용. --serve는 항상 끈다
  target_buffer_sec: 30        # 백엔드 backpressure의 d_total(실제 남은 방송 분량)이 이만큼이면 생성을 쉰다
  request_max_age_sec: 600     # 이보다 오래된 request.arrived는 답하지 않고 rejected로 종결 [예시]
  safety_rules: config/safety_rules.yaml
  formats_dir: config/formats  # 형식·코너 정의 (docs/CORNER_DESIGN.md)
  news_feeds: config/news_feeds.yaml  # 뉴스 형식 소재 피드와 폴링 주기

transport:
  kind: stdout                # stdout | http | redis (계약: docs/ENGINE_REDIS_CONTRACT.md)
  base_url: http://localhost:3000   # kind: http 일 때 백엔드 주소
                                    # 토큰은 ONAIR_ENGINE_TOKEN 환경변수로 주입
  redis_url: redis://localhost:6379/0  # kind: redis 일 때. 비밀번호가 있으면 ONAIR_REDIS_URL로 주입
  contract_version: 2         # 엔진→백엔드 이벤트의 계약 버전. 2면 input_refs·reflection_levels와 v2 request.state 값을
                              # 보내고, 한 멘트에 입력 여러 건을 싣는다 (계약 10.4·10.5·10.10절, #267).
                              # 백엔드가 v1·v2를 함께 받게 배포돼(PR #284) 2026-11-15에 2로 올렸다 (#157).
                              # 문제가 생기면 1로 되돌린다. 환경변수 ONAIR_CONTRACT_VERSION이 있으면 그 값이 먼저다
  audio_dir: var/audio        # 백엔드와 공유하는 오디오 루트.
                              # 제출 페이로드의 audio_ref는 이 경로 기준 상대 경로다

telemetry:
  sqlite_path: var/engine_metrics.sqlite

api:                          # 엔진 REST (계약 6장) — --serve, --api 때만 연다
  host: 127.0.0.1             # 단일 VM에서 백엔드만 접근 — 루프백에만 연다
  port: 8100                  # [예시]
  draft_timeout_sec: 30       # persona 초안 생성 상한 (응답 목표 15초)
                              # 인증 토큰은 ONAIR_ENGINE_TOKEN 환경변수 — 없으면 인증 없이 연다

context:
  recent_segments: 8          # 방송 맥락 = 최근 N개 세그먼트 요약 (확인 10 결정)
