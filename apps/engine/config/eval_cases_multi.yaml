# 한 멘트에 입력 여러 건 평가 사례 (onair-eval --cases config/eval_cases_multi.yaml, #267).
# 계약 v2로 보낼 때만 나오는 멘트 두 가지를 본다.
#   +chat2      채팅 두 건을 한 멘트에 인용한다 (참여 강도 high)
#   story+chat  사연 멘트에 채팅 한 건을 함께 싣는다
# 리포트의 "인용 누락" 표에서 두 건을 넣은 멘트는 한 건이라도 빠지면 누락으로 센다.
# results.jsonl의 quotes에 건마다의 판정이 있다.
#
# 채팅은 위에서부터 차례로 꺼낸다. +chat2는 두 건, +chat은 한 건을 쓴다.
# 문장은 config/eval_cases_chat.yaml과 시나리오(config/scenarios)의 채팅과 겹치지 않게 썼다.
topic: 주말에 뭐 하세요
guide: 채팅은 언제든 편하게 보내 주세요.

sequence:
  - opening_greeting
  - topic_intro
  - talk_open
  - talk+chat2
  - music_intro+chat2
  - story+chat
  - talk+chat2
  - music_intro+chat2
  - story+chat
  - talk+chat2
  - music_intro+chat2
  - story+chat
  - talk+chat2
  - music_intro+chat2
  - story+chat

tracks:
  - {title: 토요일 아침, artist: 가상의 가수, mood: upbeat}
  - {title: 느린 일요일, artist: 모의 밴드, mood: calm}
  - {title: 한강 자전거, artist: 시뮬레이션 트리오, mood: hopeful}
  - {title: 빨래가 마르는 오후, artist: 테스트 오케스트라, mood: mellow}

stories:
  - id: camping
    body: 이번 주말에 처음으로 혼자 캠핑을 가 보려고요. 텐트도 새로 샀는데 잘 칠 수 있을지 벌써 걱정이에요.
    expect: air
  - id: grandma
    body: 주말마다 할머니 댁에 가서 같이 드라마를 봐요. 내용은 잘 모르겠는데 할머니가 설명해 주시는 게 더 재밌어요.
    expect: air
  - id: nothing
    body: 주말에 아무 계획이 없는데 그게 제일 좋더라고요. 알람 안 맞추고 자는 게 이번 주 목표입니다.
    expect: air
  - id: baking
    body: 지난 주말에 처음으로 빵을 구웠는데 돌덩이가 나왔어요. 이번 주말에 다시 도전합니다.
    expect: air

