# L0(입력단)/L2(출력단) 공용 룰 — 코드와 분리해 관리 (설계 문서 4.6)
# 초기 예시 룰이며 팀 검토를 거쳐 확장한다. (YAML 단일따옴표 = 정규식 리터럴)
banned_patterns:
  - '01[016789][ -]?\d{3,4}[ -]?\d{4}'        # 전화번호
  - 'https?://\S+'                             # URL
  - '[\w.+-]+@[\w-]+\.[\w.]+'                  # 이메일
  - '(씨발|병신|새끼|좆)'                        # 욕설(예시)
