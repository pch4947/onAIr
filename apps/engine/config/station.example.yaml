# 로컬 개발용 스테이션 설정 — 실제 운영에서는 station.created 이벤트가 이 역할을 대체한다 (M3)
station:
  id: st_local_dev
  # persona 파일 경로 또는 필드 직접 기입 (dj_name, tone, concept + 선택: examples, forbidden,
  # signature_phrases). 프리셋: config/personas/ — 실행 시 --persona로 바꿔 끼울 수 있다
  profile: config/personas/saebyeok.yaml
  broadcast_minutes: 60
  # 방송 형식과 호스트 선택 — 운영에서는 station.created가 싣는다 (계약 v2 10.2절, #102)
  format: talk                # music | talk | news — config/formats/{format}.yaml. 실행 시 --format으로 바꿀 수 있다
  # corners: [story_corner, topic_talk]   # talk 본 코너 2~3개. 비우면 형식 기본값
  # news_sections: [general, it]          # news 분야 2~3개 (general·economy·it·sports·culture)
  intensity: mid              # 참여 강도 low | mid | high
  topic: 시험 기간을 버티는 나만의 방법   # 오늘의 주제. 비우면 컨셉을 쓴다
  # first_song: {track_ref: "yt:abc123", title: 밤편지, artist: 아이유, duration_ms: 253000}

pipeline:
  llm: dummy                  # dummy(고정 대본) | claude(ANTHROPIC_API_KEY 필요)
                              # | gemini(GEMINI_API_KEY 필요) — 제공자 비교 실측 중(확인 3)
                              # | openai(Chat Completions 호환, OPENAI_API_KEY)
  # llm_model: gpt-6-luna       # 팀 결정 LLM (llm: openai, 2026-10-08). claude 기본값: claude-haiku-4-5,
                                # gemini 기본값: gemini-2.5-flash. openai는 필수
  # llm_base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1  # openai 호환 서버
  # llm_reasoning_effort: low    # openai 추론 모델의 추론량 — 낮을수록 빠르다
  tts: dummy                  # dummy(무음 wav) | cartesia(팀 결정 운영 TTS, CARTESIA_API_KEY 필요)
                              # | google(Cloud TTS, GOOGLE_TTS_API_KEY) | edge(청취 테스트용, pip install -e ".[tts]")
  # tts_voice: <Cartesia 보이스 ID>   # cartesia는 필수 — 목록: onair-engine --list-voices
                                      # google 기본값: ko-KR-Chirp3-HD-Aoede, edge 기본값: ko-KR-SunHiNeural
  tts_cache_dir: var/tts_cache  # 같은 문장 재합성 방지 캐시 — 엔진 전용, audio_dir 밖에 둔다
  max_concurrent_generations: 2
  dummy_tracks: true           # 백엔드 곡(track.queued)이 없을 때 더미 곡 이름으로 곡 소개 — 로컬용. --serve는 항상 끈다
  target_buffer_sec: 30        # 백엔드 backpressure의 d_total(실제 남은 방송 분량)이 이만큼이면 생성을 쉰다
  request_max_age_sec: 600     # 이보다 오래된 request.arrived는 답하지 않고 rejected로 종결 [예시]
  safety_rules: config/safety_rules.yaml
  formats_dir: config/formats  # 형식·코너 정의 (docs/CORNER_DESIGN.md)

transport:
  kind: stdout                # stdout | http | redis (계약: docs/ENGINE_REDIS_CONTRACT.md)
  base_url: http://localhost:3000   # kind: http 일 때 백엔드 주소
                                    # 토큰은 ONAIR_ENGINE_TOKEN 환경변수로 주입
  redis_url: redis://localhost:6379/0  # kind: redis 일 때. 비밀번호가 있으면 ONAIR_REDIS_URL로 주입
  audio_dir: var/audio        # 백엔드와 공유하는 오디오 루트.
                              # 제출 페이로드의 audio_ref는 이 경로 기준 상대 경로다

telemetry:
  sqlite_path: var/engine_metrics.sqlite

api:                          # 엔진 REST (계약 6장) — --serve, --api 때만 연다
  host: 127.0.0.1             # 단일 VM에서 백엔드만 접근 — 루프백에만 연다
  port: 8100                  # [예시]
  draft_timeout_sec: 30       # persona 초안 생성 상한 (응답 목표 15초)
                              # 인증 토큰은 ONAIR_ENGINE_TOKEN 환경변수 — 없으면 인증 없이 연다

context:
  recent_segments: 8          # 방송 맥락 = 최근 N개 세그먼트 요약 (확인 10 결정)
